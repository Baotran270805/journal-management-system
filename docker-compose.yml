services:
  mysql:
    image: mysql:8.4
    container_name: journal-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "journal_db"
      MYSQL_USER: "PTIT"
      MYSQL_PASSWORD: "123456"

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: